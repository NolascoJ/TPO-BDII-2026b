services:
  mongo:
    image: mongo:8.0.15
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ports: ['127.0.0.1:27017:27017']
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)']
      interval: 3s
      timeout: 5s
      retries: 40
  mongo-init:
    image: mongo:8.0.15
    depends_on:
      mongo: { condition: service_healthy }
    entrypoint: [mongosh, --host, 'mongo:27017', --quiet, --eval]
    command:
      - 'try { rs.status(); } catch (e) { if (e.code === 94) rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}); else throw e; } for(let i=0;i<120;i++){if(db.hello().isWritablePrimary) quit(0); sleep(1000);} quit(1);'
  neo4j:
    image: neo4j:5.26.12-community
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/desarrollo-local}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports: ['127.0.0.1:7474:7474', '127.0.0.1:7687:7687']
    volumes: [neo4j-data:/data]
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://localhost:7474 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 60
  app:
    image: node:24.7.0-bookworm
    profiles: [dev]
    working_dir: /workspace
    command: sleep infinity
    volumes: ['.:/workspace']
    environment:
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGODB_DATABASE: farmared
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-desarrollo-local}
      NEO4J_DATABASE: neo4j
    depends_on:
      mongo-init: { condition: service_completed_successfully }
      neo4j: { condition: service_healthy }
volumes:
  mongo-data:
  neo4j-data:
